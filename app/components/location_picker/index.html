<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
        color: #172522;
        font-family: "DM Sans", "Segoe UI", sans-serif;
      }
      button {
        border: 0;
        border-radius: 9px;
        background: #176b5b;
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 0.65rem 1rem;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }
      #status {
        min-height: 1.2rem;
        color: #52635d;
        font-size: 13px;
        margin-top: 0.4rem;
      }
      #status.error {
        color: #8f332f;
      }
    </style>
  </head>
  <body>
    <button id="use-location" type="button">Use My Location</button>
    <div id="status" role="status"></div>
    <script>
      const button = document.getElementById("use-location");
      const status = document.getElementById("status");

      function requestId() {
        return window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function sendValue(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value,
          dataType: "json"
        }, "*");
      }

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          status.textContent = "This browser does not support location. Enter an address manually.";
          status.classList.add("error");
          sendValue({
            status: "error",
            message: "This browser does not support location.",
            request_id: requestId()
          });
          return;
        }

        button.disabled = true;
        status.classList.remove("error");
        status.textContent = "Waiting for location permission...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            button.disabled = false;
            status.textContent = "Location received.";
            sendValue({
              status: "success",
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              request_id: requestId()
            });
          },
          (error) => {
            button.disabled = false;
            const message = error.code === error.PERMISSION_DENIED
              ? "Location permission was denied. Enter an address or search by town."
              : "Unable to get your location. Enter an address or search by town.";
            status.textContent = message;
            status.classList.add("error");
            sendValue({
              status: "error",
              message,
              request_id: requestId()
            });
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
        );
      });

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          button.disabled = false;
          const label = event.data.args && event.data.args.button_label;
          if (label) {
            button.textContent = label;
          }
        }
      });

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: document.body.scrollHeight
      }, "*");
    </script>
  </body>
</html>
